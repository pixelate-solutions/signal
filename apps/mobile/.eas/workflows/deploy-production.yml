name: Build and submit Signal production

on:
  push:
    tags: ["v*"]

jobs:
  build_android:
    name: Build Android production
    type: build
    environment: production
    params:
      platform: android
      profile: production

  build_ios:
    name: Build iOS production
    type: build
    environment: production
    params:
      platform: ios
      profile: production

  approve_submission:
    name: Approve store submission
    needs: [build_android, build_ios]
    type: require-approval

  submit_android:
    name: Submit Android production
    needs: [build_android, approve_submission]
    type: submit
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
      profile: production

  submit_ios:
    name: Submit iOS production
    needs: [build_ios, approve_submission]
    type: submit
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production
