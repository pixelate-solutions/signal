name: Core release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  images:
    runs-on: ubuntu-24.04
    environment: staging-core
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: infra/docker/node.Dockerfile
            build_args: SIGNAL_PACKAGE=@signal/api
          - name: workflow-worker
            dockerfile: infra/docker/node.Dockerfile
            build_args: SIGNAL_PACKAGE=@signal/workflow-worker
          - name: browser-worker
            dockerfile: infra/docker/browser.Dockerfile
            build_args: ""
          - name: sandbox-controller
            dockerfile: infra/docker/node.Dockerfile
            build_args: SIGNAL_PACKAGE=@signal/sandbox-controller
          - name: document-worker
            dockerfile: infra/docker/document.Dockerfile
            build_args: ""
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_args }}
          push: true
          provenance: true
          sbom: true
          tags: ghcr.io/pixelate-solutions/signal-${{ matrix.name }}:${{ github.ref_name }}
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/pixelate-solutions/signal-${{ matrix.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  deploy-staging:
    needs: images
    runs-on: ubuntu-24.04
    environment: staging-core
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}
      - run: helm upgrade --install signal infra/helm/signal --namespace signal --create-namespace --values infra/helm/values-staging.yaml --atomic --timeout 15m
