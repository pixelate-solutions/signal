{{- range $identity, $account := .Values.serviceAccounts }}
{{- if $account.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "signal.serviceAccount" (list $ $identity) }}
  labels:
    {{- include "signal.labels" $ | nindent 4 }}
    signal.pixelate.dev/identity: {{ $identity }}
  {{- with $account.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
