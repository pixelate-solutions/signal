{{- if .Values.clamav.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "signal.fullname" . }}-clamav
  labels:
    {{- include "signal.labels" . | nindent 4 }}
    app.kubernetes.io/component: clamav
spec:
  replicas: {{ .Values.clamav.replicas }}
  revisionHistoryLimit: 3
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "signal.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: clamav
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "signal.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/part-of: signal
        app.kubernetes.io/component: clamav
        signal.pixelate.dev/identity: restricted
    spec:
      serviceAccountName: {{ include "signal.serviceAccount" (list . "restricted") }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      nodeSelector:
        signal.pixelate.dev/pool: core
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: seed-definitions
          image: {{ .Values.clamav.image | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: ["/bin/sh", "-ec", "cp -R /var/lib/clamav/. /definitions/"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: definitions, mountPath: /definitions }
            - { name: tmp, mountPath: /tmp }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 256Mi }
      containers:
        - name: clamav
          image: {{ .Values.clamav.image | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: ["/init-unprivileged"]
          ports:
            - { name: clamd, containerPort: 3310, protocol: TCP }
          startupProbe:
            tcpSocket: { port: clamd }
            failureThreshold: 90
            periodSeconds: 10
          readinessProbe:
            tcpSocket: { port: clamd }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket: { port: clamd }
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 5
          resources:
            {{- toYaml .Values.clamav.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: definitions, mountPath: /var/lib/clamav }
            - { name: logs, mountPath: /var/log/clamav }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: definitions
          emptyDir: { sizeLimit: {{ .Values.clamav.databaseSizeLimit }} }
        - name: logs
          emptyDir: { sizeLimit: 256Mi }
        - name: tmp
          emptyDir: { sizeLimit: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "signal.fullname" . }}-clamav
  labels:
    {{- include "signal.labels" . | nindent 4 }}
    app.kubernetes.io/component: clamav
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "signal.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: clamav
  ports:
    - { name: clamd, port: 3310, targetPort: clamd, protocol: TCP }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "signal.fullname" . }}-clamav
  labels:
    {{- include "signal.labels" . | nindent 4 }}
    app.kubernetes.io/component: clamav
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "signal.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: clamav
{{- end }}
