{{- range $name, $workload := .Values.workloads }}
{{- if and $workload.enabled $workload.service }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "signal.fullname" $ }}-{{ $name }}
  labels:
    {{- include "signal.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "signal.name" $ }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/component: {{ $name }}
  ports:
    - name: http
      port: {{ $workload.servicePort }}
      targetPort: http
      protocol: TCP
{{- end }}
{{- end }}
